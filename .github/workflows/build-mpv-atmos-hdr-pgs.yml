name: Build mpv Atmos HDR PGS fix

on:
  push:
    branches:
      - codex/hdr-pgs-core-fix
    paths:
      - ".github/workflows/build-mpv-atmos-hdr-pgs.yml"
      - "build/atmos/pin-mpv-master.patch"
      - "build/atmos/pin-fel-dependencies.patch"
      - "build/core-candidate/**"
      - "patches/0008-vo_gpu_next-add-image-subtitle-colorspace-control-master.patch"
  workflow_dispatch:

permissions:
  contents: read

env:
  MPV_MASTER_REF: 8c67647b50059406c5c0444903597281b81516cf
  MPV_OMNIPHONY_REF: v0.4.2-fel-beta.1
  OMNIPHONY_ENGINE_REF: v0.4.2
  CURL_REF: 68720b4837284335b2d63cb358f8f6ce65f5bc55

jobs:
  build-liborender-windows:
    runs-on: windows-latest
    steps:
      - name: Check out pinned Omniphony engine
        uses: actions/checkout@v6
        with:
          repository: mgth/Omniphony
          ref: ${{ env.OMNIPHONY_ENGINE_REF }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build pinned liborender
        working-directory: omniphony-renderer
        env:
          RUSTFLAGS: -D warnings -A dead_code
        run: cargo build --release -p orender_ffi

      - name: Stage liborender artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item omniphony-renderer/target/release/orender.dll out/
          Copy-Item omniphony-renderer/orender_ffi/include/orender.h out/

      - name: Upload liborender artifact
        uses: actions/upload-artifact@v6
        with:
          name: liborender-windows-v0.4.2
          path: out
          if-no-files-found: error

  build-windows:
    needs: build-liborender-windows
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 240

    steps:
      - name: Check out mpv-Yaozhi patch
        uses: actions/checkout@v6

      - name: Check out mpv-omniphony beta.1 integration
        uses: actions/checkout@v6
        with:
          repository: mgth/mpv-omniphony
          ref: ${{ env.MPV_OMNIPHONY_REF }}
          path: mpv-omniphony

      - name: Bootstrap Arch and MinGW repository
        shell: bash
        run: |
          set -euxo pipefail
          pacman-key --init
          cat >> /etc/pacman.conf <<'EOF'

          [ownstuff]
          SigLevel = Optional TrustAll
          Server = https://martchus.no-ip.biz/repo/arch/$repo/os/$arch
          EOF
          pacman -Syu --noconfirm

      - name: Install MinGW and FEL build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          pacman -S --noconfirm --needed \
            base-devel git unzip zip curl rustup nasm cmake \
            mingw-w64-gcc \
            mingw-w64-cmake \
            mingw-w64-pkg-config \
            mingw-w64-meson \
            mingw-w64-libass \
            mingw-w64-vulkan-headers mingw-w64-vulkan-icd-loader \
            mingw-w64-shaderc mingw-w64-spirv-cross mingw-w64-lcms2 \
            mingw-w64-zlib mingw-w64-libdvdnav mingw-w64-libdvdread
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Pin FEL dependency sources
        shell: bash
        run: |
          set -euxo pipefail
          git -C mpv-omniphony apply \
            "$GITHUB_WORKSPACE/build/atmos/pin-fel-dependencies.patch"

      - name: Install prebuilt cargo-c
        shell: bash
        run: |
          set -euxo pipefail
          CARGOC_VER=0.10.23
          curl -fsSL \
            "https://github.com/lu-zero/cargo-c/releases/download/v${CARGOC_VER}/cargo-c-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /usr/local/bin \
                cargo-capi cargo-cbuild cargo-cinstall cargo-ctest
          command -v cargo-cinstall

      - name: Write MinGW cross file
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p sysroot
          cat > sysroot/mingw-cross.ini <<'EOF'
          [binaries]
          c = 'x86_64-w64-mingw32-gcc'
          cpp = 'x86_64-w64-mingw32-g++'
          ar = 'x86_64-w64-mingw32-ar'
          strip = 'x86_64-w64-mingw32-strip'
          pkg-config = 'x86_64-w64-mingw32-pkg-config'
          windres = 'x86_64-w64-mingw32-windres'
          dlltool = 'x86_64-w64-mingw32-dlltool'

          [host_machine]
          system = 'windows'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

      - name: Build pinned Schannel libcurl
        shell: bash
        run: |
          set -euxo pipefail
          SYS=/usr/x86_64-w64-mingw32
          git init curl-src
          git -C curl-src remote add origin https://github.com/curl/curl.git
          git -C curl-src fetch --depth=1 origin "$CURL_REF"
          git -C curl-src checkout --detach FETCH_HEAD
          test "$(git -C curl-src rev-parse HEAD)" = "$CURL_REF"

          x86_64-w64-mingw32-cmake -S curl-src -B curl-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SYS" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_STATIC_LIBS=OFF \
            -DBUILD_CURL_EXE=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_LIBCURL_DOCS=OFF \
            -DBUILD_MISC_DOCS=OFF \
            -DBUILD_TESTING=OFF \
            -DCURL_USE_OPENSSL=OFF \
            -DCURL_USE_SCHANNEL=ON \
            -DCURL_CA_NATIVE=ON \
            -DUSE_ECH=OFF \
            -DCURL_ZLIB=ON \
            -DCURL_BROTLI=OFF \
            -DCURL_ZSTD=OFF \
            -DCURL_USE_LIBPSL=OFF \
            -DCURL_USE_LIBSSH2=OFF \
            -DUSE_NGHTTP2=OFF \
            -DUSE_NGTCP2=OFF \
            -DUSE_QUICHE=OFF \
            -DCURL_DISABLE_LDAP=ON \
            -DCURL_DISABLE_LDAPS=ON
          cmake --build curl-build --parallel "$(nproc)"
          cmake --install curl-build

          grep -Fq '#define USE_SCHANNEL 1' curl-build/lib/curl_config.h
          if grep -Fq '#define USE_OPENSSL 1' curl-build/lib/curl_config.h; then
            echo "::error::Atmos libcurl unexpectedly enabled OpenSSL"
            exit 1
          fi
          test -n "$(find "$SYS/bin" -maxdepth 1 -iname 'libcurl*.dll' -print -quit)"
          x86_64-w64-mingw32-pkg-config --atleast-version=8.21.0 libcurl
          x86_64-w64-mingw32-pkg-config --libs libcurl

      - name: Resolve libplacebo source
        id: libplacebo
        shell: bash
        run: |
          set -euxo pipefail
          source mpv-omniphony/deps-fel/pins-fel.env
          sha="$(git ls-remote "$LIBPLACEBO_URL" "$LIBPLACEBO_REF" | cut -f1)"
          test -n "$sha"
          echo "ref=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore FEL dependency cache
        id: felcache
        uses: actions/cache@v5
        with:
          path: |
            /usr/x86_64-w64-mingw32/bin/avcodec*.dll
            /usr/x86_64-w64-mingw32/bin/avfilter*.dll
            /usr/x86_64-w64-mingw32/bin/avformat*.dll
            /usr/x86_64-w64-mingw32/bin/avutil*.dll
            /usr/x86_64-w64-mingw32/bin/avdevice*.dll
            /usr/x86_64-w64-mingw32/bin/swresample*.dll
            /usr/x86_64-w64-mingw32/bin/swscale*.dll
            /usr/x86_64-w64-mingw32/bin/libplacebo*.dll
            /usr/x86_64-w64-mingw32/bin/libdovi*.dll
            /usr/x86_64-w64-mingw32/lib/pkgconfig/libav*.pc
            /usr/x86_64-w64-mingw32/lib/pkgconfig/libsw*.pc
            /usr/x86_64-w64-mingw32/lib/pkgconfig/libplacebo.pc
            /usr/x86_64-w64-mingw32/lib/pkgconfig/dovi.pc
            /usr/x86_64-w64-mingw32/lib/libplacebo*
            /usr/x86_64-w64-mingw32/lib/libav*
            /usr/x86_64-w64-mingw32/lib/libsw*
            /usr/x86_64-w64-mingw32/lib/libdovi*
            /usr/x86_64-w64-mingw32/include/libplacebo
            /usr/x86_64-w64-mingw32/include/libav*
            /usr/x86_64-w64-mingw32/include/libsw*
            /usr/x86_64-w64-mingw32/include/ffnvcodec
          key: mpv-atmos-fel-mingw-v3-${{ steps.libplacebo.outputs.ref }}-${{ hashFiles('mpv-omniphony/deps-fel/**', 'mpv-omniphony/scripts/build-fel-deps.sh') }}

      - name: Build FEL dependencies
        if: steps.felcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          PREFIX=/usr/x86_64-w64-mingw32 \
          WORK="$GITHUB_WORKSPACE/fel-work" \
          CROSS_FILE="$GITHUB_WORKSPACE/sysroot/mingw-cross.ini" \
            bash mpv-omniphony/scripts/build-fel-deps.sh --cross

      - name: Verify FEL dependencies
        shell: bash
        run: |
          set -euxo pipefail
          x86_64-w64-mingw32-pkg-config --atleast-version=7.370 libplacebo
          x86_64-w64-mingw32-pkg-config --exists dovi
          x86_64-w64-mingw32-pkg-config --atleast-version=8.21.0 libcurl

      - name: Build ABI-matched libsrt
        shell: bash
        run: |
          set -euxo pipefail
          SYS=/usr/x86_64-w64-mingw32
          pacman -S --noconfirm --needed --overwrite '*' \
            mingw-w64-cmake mingw-w64-openssl
          SRT_VER=1.5.5
          curl -fsSLO \
            "https://github.com/Haivision/srt/archive/refs/tags/v${SRT_VER}.tar.gz"
          tar xzf "v${SRT_VER}.tar.gz"
          mkdir "srt-${SRT_VER}/build"
          cd "srt-${SRT_VER}/build"
          x86_64-w64-mingw32-cmake .. \
            -DENABLE_APPS=OFF \
            -DENABLE_BONDING=OFF \
            -DENABLE_STATIC=OFF \
            -DENABLE_SHARED=ON \
            -DCMAKE_INSTALL_PREFIX="$SYS"
          cmake --build . -j"$(nproc)"
          cmake --install .
          if [ -f "$SYS/bin/srt.dll" ] && [ ! -f "$SYS/bin/libsrt.dll" ]; then
            cp "$SYS/bin/srt.dll" "$SYS/bin/libsrt.dll"
          fi

      - name: Build Lua 5.2
        shell: bash
        run: |
          set -euxo pipefail
          SYS=/usr/x86_64-w64-mingw32
          LUA_VER=5.2.4
          curl -fsSLO "https://www.lua.org/ftp/lua-${LUA_VER}.tar.gz"
          tar xzf "lua-${LUA_VER}.tar.gz"
          make -C "lua-${LUA_VER}" \
            PLAT=mingw \
            CC=x86_64-w64-mingw32-gcc \
            AR="x86_64-w64-mingw32-ar rcu" \
            RANLIB=x86_64-w64-mingw32-ranlib \
            mingw
          install -Dm755 "lua-${LUA_VER}/src/lua52.dll" "$SYS/bin/lua52.dll"
          install -Dm644 "lua-${LUA_VER}/src/liblua.a" "$SYS/lib/liblua52.a"
          for header in lua lualib lauxlib luaconf; do
            install -Dm644 "lua-${LUA_VER}/src/${header}.h" "$SYS/include/${header}.h"
          done
          install -d "$SYS/lib/pkgconfig"
          cat > "$SYS/lib/pkgconfig/lua52.pc" <<EOF
          prefix=$SYS
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: Lua
          Description: Lua 5.2 (MinGW cross build)
          Version: ${LUA_VER}
          Libs: -L\${libdir} -llua52
          Cflags: -I\${includedir}
          EOF

      - name: Download pinned liborender
        uses: actions/download-artifact@v7
        with:
          name: liborender-windows-v0.4.2
          path: /tmp/liborender

      - name: Install pinned liborender
        shell: bash
        run: |
          set -euxo pipefail
          SYS=/usr/x86_64-w64-mingw32
          engine=/tmp/liborender/orender.dll
          header=/tmp/liborender/orender.h
          test -f "$engine"
          test -f "$header"
          install -Dm755 "$engine" "$SYS/bin/orender.dll"
          install -Dm755 "$engine" "$SYS/lib/orender.dll"
          install -Dm644 "$header" "$SYS/include/orender.h"
          install -d "$SYS/lib/pkgconfig"
          cat > "$SYS/lib/pkgconfig/orender.pc" <<EOF
          prefix=$SYS
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: orender
          Description: Omniphony renderer C library
          Version: 0.99.0
          Libs: -L\${libdir} -lorender
          Cflags: -I\${includedir}
          EOF

      - name: Build libbluray with BD-ISO support
        shell: bash
        run: |
          set -euxo pipefail
          CROSS_FILE="$GITHUB_WORKSPACE/sysroot/mingw-cross.ini" \
            bash mpv-omniphony/scripts/build-libbluray-mingw.sh

      - name: Apply Atmos and image subtitle patches
        shell: bash
        run: |
          set -euxo pipefail
          cd mpv-omniphony
          git apply "$GITHUB_WORKSPACE/build/atmos/pin-mpv-master.patch"
          MPV_MASTER_REF="$MPV_MASTER_REF" bash scripts/apply-patches-master.sh
          src="$(find build -maxdepth 1 -type d -name 'mpv-master-*' \
            ! -name 'mpv-master-clone' -print -quit)"
          test -n "$src"
          src="$(realpath "$src")"
          git -C "$src" apply --3way \
            "$GITHUB_WORKSPACE/patches/0008-vo_gpu_next-add-image-subtitle-colorspace-control-master.patch"
          for patch in \
            mpv-8801-curl-request-start-race.patch \
            mpv-8802-curl-range-validation.patch \
            mpv-8803-curl-compression-bounds.patch \
            mpv-8804-demux-interrupt-discarded-read.patch \
            mpv-8805-vo-frame-refs.patch \
            mpv-8805-hwdec-surface-pool.patch \
            mpv-8806-spdif-reset.patch; do
            git -C "$src" apply --3way \
              "$GITHUB_WORKSPACE/build/core-candidate/$patch"
          done
          grep -Fq 'Server ignored range request at offset' \
            "$src/stream/stream_curl.c"
          grep -Fq 'vo_get_num_frame_refs' "$src/video/out/vo.c"
          grep -Fq 'hwdec_get_extra_frames' "$src/video/decode/vd_lavc.c"
          grep -Fq 'Still waiting for TrueHD major sync' \
            "$src/audio/decode/ad_spdif.c"
          echo "MPV_DIR=$src" >> "$GITHUB_ENV"
          git -C "$src" diff --check

      - name: Cross-compile Atmos mpv
        shell: bash
        run: |
          set -euxo pipefail
          cd "$MPV_DIR"
          meson setup _b \
            --cross-file="$GITHUB_WORKSPACE/sysroot/mingw-cross.ini" \
            -Dorender=enabled \
            -Dlua=lua52 \
            -Dlibcurl=enabled \
            -Dasio=enabled \
            -Dd3d11=enabled \
            -Dcuda-hwaccel=enabled \
            -Dlibbluray=enabled \
            -Ddvdnav=enabled
          meson compile -C _b

      - name: Package custom Atmos player
        shell: bash
        run: |
          set -euxo pipefail
          SYS=/usr/x86_64-w64-mingw32
          mkdir -p staging
          cp "$MPV_DIR/_b/mpv.exe" staging/
          cp "$MPV_DIR/_b/mpv.com" staging/
          cp "$SYS/bin/orender.dll" staging/
          cp "$SYS/include/orender.h" staging/
          cp mpv-omniphony/README.md staging/
          cp mpv-omniphony/COPYING staging/
          cp mpv-omniphony/THIRD-PARTY-NOTICES.md staging/
          cp patches/0008-vo_gpu_next-add-image-subtitle-colorspace-control-master.patch \
            staging/0008-image-subs-colorspace-master.patch

          strings -a staging/mpv.exe > staging/mpv.strings
          grep -Fq 'secondary-sub-scale' staging/mpv.strings
          grep -Fq 'Server ignored range request at offset' staging/mpv.strings
          grep -Fq 'Still waiting for TrueHD major sync' staging/mpv.strings
          grep -Fq 'ad-orender-library' staging/mpv.strings
          grep -Fq 'image-subs-colorspace' staging/mpv.strings
          x86_64-w64-mingw32-objdump -p staging/mpv.exe > staging/mpv.imports
          grep -Eqi 'DLL Name:.*curl' staging/mpv.imports

          should_skip() {
            local dll="${1^^}"
            case "$dll" in
              KERNEL32.*|USER32.*|GDI32.*|ADVAPI32.*|MSVCRT.*|SHELL32.*|SHCORE.*|SHLWAPI.*|OLE32.*|OLEAUT32.*|WS2_32.*|IMM32.*|VERSION.*|WINMM.*|AVICAP32.*|AVRT.*|D3D*|DXGI*|OPENGL32.*|SETUPAPI.*|RPCRT4.*|BCRYPT.*|BCRYPTPRIMITIVES.*|CFGMGR32.*|CRYPT32.*|COMDLG32.*|NETAPI32.*|NTDLL.*|POWRPROF.*|PSAPI.*|USERENV.*|WININET.*|WINTRUST.*|COMCTL32.*|IPHLPAPI.*|SECUR32.*|UXTHEME.*|DWMAPI.*|NCRYPT.*|DNSAPI.*|MPR.*|MSWSOCK.*|ODBC32.*|ODBCP32.*|VCRUNTIME*|API-MS-*|EXT-MS-*)
                return 0 ;;
            esac
            return 1
          }

          worklist=(staging/mpv.exe)
          while [ ${#worklist[@]} -gt 0 ]; do
            binary="${worklist[0]}"
            worklist=("${worklist[@]:1}")
            for dll in $(x86_64-w64-mingw32-objdump -p "$binary" 2>/dev/null \
              | awk '/DLL Name:/ {print $3}'); do
              should_skip "$dll" && continue
              [ -f "staging/$dll" ] && continue
              if [ -f "$SYS/bin/$dll" ]; then
                cp "$SYS/bin/$dll" staging/
                worklist+=("staging/$dll")
              else
                echo "Missing dependency: $dll" >&2
                exit 1
              fi
            done
          done

          curl_dll="$(find staging -maxdepth 1 -iname 'libcurl*.dll' -print -quit)"
          test -n "$curl_dll"
          strings -a "$curl_dll" > staging/libcurl.strings
          grep -qi 'schannel' staging/libcurl.strings

          for dll in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
            if [ -f "$SYS/bin/$dll" ] && [ ! -f "staging/$dll" ]; then
              cp "$SYS/bin/$dll" staging/
            fi
          done

          archive=mpv-omniphony-fel-beta.1-yaozhi-image-subs-windows-x86_64.zip
          (
            cd staging
            zip -r "../$archive" .
          )
          sha256sum "$archive" > SHA256SUMS.txt

      - name: Upload custom Atmos player
        uses: actions/upload-artifact@v6
        with:
          name: mpv-atmos-hdr-pgs-windows-x86_64
          path: |
            mpv-omniphony-fel-beta.1-yaozhi-image-subs-windows-x86_64.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
