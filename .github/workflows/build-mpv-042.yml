name: "Build reviewed mpv 0.42 Yaozhi main and Atmos"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-mpv-042.yml'
      - 'build/mpv-042/**'

concurrency:
  group: mpv-042-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [main, atmos]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPV_WINBUILD_COMMIT: b4b1088c30e8821e012fd20052de4c2d3a8eaad4
      MPV_WINBUILD_CMAKE_COMMIT: 04283f7e911149809c46bc236a834cf7134ba133
      MPV_COMMIT: c318236b8882af860f16f936225430ad053a2179
      CPPWINRT_COMMIT: 856eaff70a48d6b053c2ad3dffec15b81ca34b10
      WINDOWS_RS_COMMIT: cad85f9e122b8236f3619ab67b88a1e7242dcb7d
      WINDOWS_WINMD_SHA256: 9ddfc6f5e5c3d29522f35e1cac566617e9d28ccbc6ccb072c79fa9949cdbe336
      DAVS2_COMMIT: b42ffca966970dc788f8c57549bee038b2974346
      SDL2_COMMIT: a2e7c76bda17c853ba93c7d2c9fdddf8a9d621d1
      LIBPSL_COMMIT: aa3a80e18f25caf3916636c8668dcc0fff7c016d
      CURL_COMMIT: c2a04c080d79e1eb5d99bc0a73fd71710aa6d345
      LIBSSH_COMMIT: 26c594227c74bf9fa75fed5d8be61afd1abebc43
      OPENSSL_COMMIT: 052c9eac52d7eb02a61cfe7c70289c13f06a50e1

      MPV_042_COMMIT: b0841e8c4d156b8403dc1876c4cbd9011eb583f3

    steps:
      - name: Install build dependencies
        run: |
          # Prefer the hosted image's package index. If it has gone stale,
          # refresh once with bounded retries before the second install attempt.
          apt_install() {
            local attempt
            for attempt in 1 2; do
              if timeout --foreground --kill-after=2m 45m \
                sudo env DEBIAN_FRONTEND=noninteractive apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                install -y "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 1 ]; then
                timeout --foreground --kill-after=1m 10m \
                  sudo apt-get \
                  -o Acquire::Retries=3 \
                  -o Acquire::http::Timeout=30 \
                  -o Acquire::https::Timeout=30 \
                  update
                timeout --foreground --kill-after=1m 10m \
                  sudo dpkg --configure -a || true
              fi
            done
            return 1
          }

          apt_install \
            build-essential bison flex gettext git mercurial subversion \
            ninja-build gyp cmake yasm nasm automake pkg-config libtool \
            libtool-bin gcc-multilib g++-multilib clang lld libc++-dev \
            libc++abi-dev libgmp-dev libmpfr-dev libmpc-dev libgcrypt20-dev \
            gperf ragel texinfo autopoint re2c python3-pip \
            python3-cairo unzip p7zip-full curl wget ccache
          apt_install luajit
          timeout --foreground --kill-after=1m 20m \
            python3 -m pip install --break-system-packages \
            --retries 3 --default-timeout 30 \
            rst2pdf meson mako jsonschema roman
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out configuration and patch
        uses: actions/checkout@v6
        with:
          # The PR base is used only for its dependency cache. Build the
          # reviewed HOLD-derived head, never the base branch's merge tree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Materialize exact unchanged speaker configuration
        shell: bash
        run: |
          set -euxo pipefail
          parent_config=fe31dc21d2b249eea3890bad2066dc578d922d0b
          LEGACY_SPEAKER_CONFIG="$RUNNER_TEMP/native-refresh-parent-config"
          printf 'LEGACY_SPEAKER_CONFIG=%s\n' "$LEGACY_SPEAKER_CONFIG" >> "$GITHUB_ENV"
          timeout --foreground --kill-after=20s 120s \
            git fetch --no-tags --depth=1 origin "$parent_config"
          test ! -e "$LEGACY_SPEAKER_CONFIG"
          git worktree add --detach "$LEGACY_SPEAKER_CONFIG" "$parent_config"
          test "$(git -C "$LEGACY_SPEAKER_CONFIG" rev-parse HEAD)" = "$parent_config"
          test "$(git -C "$LEGACY_SPEAKER_CONFIG" rev-parse 'HEAD^{tree}')" = afb4f3015e3dcc057426a51e80a8757d5d42a5e8
          test -z "$(git -C "$LEGACY_SPEAKER_CONFIG" status --porcelain --untracked-files=all)"

      - name: Materialize exact installed native-refresh configuration
        shell: bash
        run: |
          set -euxo pipefail
          NATIVE_REFRESH_PARENT_CONFIG="$RUNNER_TEMP/native-freeze-installed-parent-config"
          printf 'NATIVE_REFRESH_PARENT_CONFIG=%s\n' "$NATIVE_REFRESH_PARENT_CONFIG" >> "$GITHUB_ENV"
          timeout --foreground --kill-after=20s 120s \
            git fetch --no-tags --depth=1 origin 1393dd3715ab02e87162dd541886fabb0766fb6c
          python3 build/atmos/parity/verify-native-freeze-source.py \
            --prepare-parent-config "$NATIVE_REFRESH_PARENT_CONFIG" \
            --output native-freeze-parent-config.json

      - name: Prepare matching Windows build system
        shell: bash
        run: |
          set -euxo pipefail

          clone_commit() {
            local repository="$1"
            local destination="$2"
            local commit="$3"
            git init "$destination"
            git -C "$destination" remote add origin "$repository"
            git -C "$destination" fetch --depth 1 origin "$commit"
            git -C "$destination" checkout --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$commit"
          }

          clone_commit \
            https://github.com/zhongfly/mpv-winbuild.git \
            winbuild \
            "$MPV_WINBUILD_COMMIT"
          clone_commit \
            https://github.com/shinchiro/mpv-winbuild-cmake.git \
            winbuild/mpv-winbuild-cmake \
            "$MPV_WINBUILD_CMAKE_COMMIT"

          cd winbuild/mpv-winbuild-cmake

          # The pinned GCC snapshot was pruned upstream and now returns
          # HTTP 404. Keep the verified build-system commit, but use the stable
          # GCC 14.4.0 source and SHA-512 published by current upstream winbuild.
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("toolchain/gcc/gcc.cmake")
          text = path.read_text()
          replacements = {
              "https://mirrorservice.org/sites/sourceware.org/pub/gcc/snapshots/14-20251205/gcc-14-20251205.tar.xz":
                  "https://ftp.gnu.org/gnu/gcc/gcc-14.4.0/gcc-14.4.0.tar.xz",
              "SHA512=b05c932de5c478cf9b64a4f2cbdf1de9b37a4845614ff8bc0e0563cd1e716f69ea0fe070ef9bf5ec1fccc0658705ec76cef536ac8dc4ca4c32cf81dad8588c37":
                  "SHA512=725ed8bdd43ef1726ffe8b5e8615a13e247fac9575b7626ae013a2975d000ea213212dc414b2f2631ac4785c1c8beca85555222faf9904d3b2fa6a3807a83a15",
          }
          for source, replacement in replacements.items():
              if text.count(source) != 1:
                  raise SystemExit(f"expected exactly one pinned GCC token: {source}")
              text = text.replace(source, replacement)
          path.write_text(text)
          PY

          for patch in ../patch/*.patch; do
            if [ "$(basename "$patch")" = \
              "0008-ngtcp2-nghttp3-nghttp2-add-ngtcp2-nghttp3-nghttp2.patch" ]; then
              echo "Skipping optional HTTP/3 patch incompatible with current OpenSSL"
              continue
            fi
            echo "Applying required build patch: $patch"
            git am --3way "$patch"
          done

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("packages/mpv.cmake")
          text = path.read_text()
          patch_command = (
              "    GIT_CLONE_FLAGS \"\"\n"
              "    PATCH_COMMAND ${EXEC} git am --3way "
              "${CMAKE_CURRENT_SOURCE_DIR}/mpv-*.patch\n"
          )
          if "mpv-*.patch" not in text:
              anchor = '    GIT_CLONE_FLAGS "--filter=tree:0"\n'
              if anchor not in text:
                  raise SystemExit("Could not locate mpv GIT_CLONE_FLAGS anchor")
              text = text.replace(anchor, patch_command, 1)

          option = "        -Dsdl2-audio=enabled\n"
          if option not in text:
              anchor = "        -Dsdl2-gamepad=enabled\n"
              if anchor not in text:
                  raise SystemExit("Could not locate SDL2 gamepad option")
              text = text.replace(anchor, anchor + option, 1)

          smtc_option = "        -Dwin32-smtc=enabled\n"
          if smtc_option not in text:
              anchor = "        -Dlibmpv=true\n"
              if anchor not in text:
                  raise SystemExit("Could not locate libmpv option")
              text = text.replace(anchor, anchor + smtc_option, 1)

          cppwinrt_dependency = "        cppwinrt\n"
          if cppwinrt_dependency not in text:
              anchor = "        angle-headers\n"
              if anchor not in text:
                  raise SystemExit("Could not locate mpv dependency anchor")
              text = text.replace(anchor, anchor + cppwinrt_dependency, 1)

          path.write_text(text)

          sdl2 = Path("packages/libsdl2.cmake")
          text = sdl2.read_text()
          patch = (
              "    PATCH_COMMAND ${EXEC} git apply --check "
              "${CMAKE_CURRENT_SOURCE_DIR}/"
              "sdl2-9000-spatial-speaker-mask.patch\n"
              "        COMMAND ${EXEC} git apply "
              "${CMAKE_CURRENT_SOURCE_DIR}/"
              "sdl2-9000-spatial-speaker-mask.patch\n"
              "        COMMAND ${EXEC} git apply --check "
              "${CMAKE_CURRENT_SOURCE_DIR}/"
              "sdl2-9001-spatial-channel-counts.patch\n"
              "        COMMAND ${EXEC} git apply "
              "${CMAKE_CURRENT_SOURCE_DIR}/"
              "sdl2-9001-spatial-channel-counts.patch\n"
          )
          if "sdl2-9000-spatial-speaker-mask.patch" not in text:
              anchor = '    UPDATE_COMMAND ""\n'
              if anchor not in text:
                  raise SystemExit("Could not locate SDL2 update anchor")
              text = text.replace(anchor, anchor + patch, 1)
          sdl2.write_text(text)

          # Build the pinned native generator here, then stage its generated
          # headers in an explicit bounded step below. This avoids the pinned
          # winbuild install-command regression without disabling C++/WinRT.
          import re

          cppwinrt = Path("toolchain/cppwinrt.cmake")
          text = cppwinrt.read_text()
          tag = f"    GIT_TAG {os.environ['CPPWINRT_COMMIT']}\n"
          if tag not in text:
              anchor = "    GIT_REPOSITORY https://github.com/microsoft/cppwinrt.git\n"
              if anchor not in text:
                  raise SystemExit("Could not locate cppwinrt repository anchor")
              text = text.replace(anchor, anchor + tag, 1)
          pattern = r"^    INSTALL_COMMAND[\s\S]*?(?=^    LOG_DOWNLOAD)"
          if not re.search(pattern, text, flags=re.MULTILINE):
              raise SystemExit("Could not locate cppwinrt install command")
          text = re.sub(pattern, '    INSTALL_COMMAND ""\n', text,
                        count=1, flags=re.MULTILINE)
          cleanup = "cleanup(cppwinrt install)\n"
          if cleanup not in text:
              raise SystemExit("Could not locate cppwinrt cleanup hook")
          # The native generator is consumed by the next workflow step. Keep
          # its build directory until the generated headers have been staged.
          text = text.replace(cleanup, "# cppwinrt cleanup is deferred\n", 1)
          cppwinrt.write_text(text)
          PY

          # Apply the single audited c318236 candidate mailbox. It
          # contains only the sixteen consecutive audited commits from the isolated
          # source tree; upstreamed fixes are supplied by the pinned base.
          cp "$GITHUB_WORKSPACE/build/atmos/parity/main-core.patch" \
            packages/mpv-9000-candidate-c318236.patch
          cp "$GITHUB_WORKSPACE/patches/0003-sdl2-wasapi-spatial-speaker-mask.patch" \
            packages/sdl2-9000-spatial-speaker-mask.patch
          cp "$GITHUB_WORKSPACE/patches/0006-sdl2-allow-spatial-channel-counts.patch" \
            packages/sdl2-9001-spatial-channel-counts.patch

          cp "$GITHUB_WORKSPACE/build/av3a/avs3-audiodec.cmake" \
            packages/avs3-audiodec.cmake
          cp "$GITHUB_WORKSPACE/build/av3a/normalize-source-eol.py" \
            packages/avs3-normalize-source-eol.py
          cp "$GITHUB_WORKSPACE/build/av3a/avs3-audiodec-static-library.patch" \
            packages/avs3-audiodec-9000-static-library.patch
          cp "$GITHUB_WORKSPACE/build/av3a/avs3-audiodecoder-stage2.patch" \
            packages/avs3-audiodec-9001-spatial-metadata.patch
          cp "$GITHUB_WORKSPACE/build/av3a/avs3-audiodecoder-preselections.patch" \
            packages/avs3-audiodec-9002-preselections.patch
          cp "$GITHUB_WORKSPACE/build/av3a/avs3-renderer-build.patch" \
            packages/avs3-renderer-build.patch
          cp "$GITHUB_WORKSPACE/build/av3a/avs3-renderer-hardening.patch" \
            packages/avs3-renderer-hardening.patch
          cp "$GITHUB_WORKSPACE/build/av3a/ffmpeg-libarcdav3a-hardening.patch" \
            packages/ffmpeg-9000-libarcdav3a-hardening.patch
          cp "$GITHUB_WORKSPACE/build/av3a/ffmpeg-libarcdav3a-spatial.patch" \
            packages/ffmpeg-9004-libarcdav3a-spatial.patch
          cp "$GITHUB_WORKSPACE/build/av3a/ffmpeg-libarcdav3a-preselections.patch" \
            packages/ffmpeg-9006-libarcdav3a-preselections.patch
          cp "$GITHUB_WORKSPACE/build/av3a/ffmpeg-av3a-multiframe-probe.patch" \
            packages/ffmpeg-9001-av3a-multiframe-probe.patch
          cp "$GITHUB_WORKSPACE/build/av3a/ffmpeg-av3a-frame-parser.patch" \
            packages/ffmpeg-9002-av3a-frame-parser.patch
          cp "$GITHUB_WORKSPACE/build/bluray-menu/patches/ffmpeg-9005-bluray-hdmv-context.patch" \
            packages/ffmpeg-9005-bluray-hdmv-context.patch
          cp "$GITHUB_WORKSPACE/build/av3a/ffmpeg-nvenc-sdk-13.1.patch" \
            packages/ffmpeg-9003-nvenc-sdk-13.1.patch
          cp "$GITHUB_WORKSPACE/build/dolby-vision/ffmpeg-dovi-split.c" \
            packages/ffmpeg-8998-dovi-split.c
          cp "$GITHUB_WORKSPACE/build/dolby-vision/ffmpeg-hevc-missing-ref-foll.patch" \
            packages/ffmpeg-8995-hevc-missing-ref-foll.patch
          cp "$GITHUB_WORKSPACE/build/dolby-vision/ffmpeg-hevc-dovi-rpu-scan.patch" \
            packages/ffmpeg-8996-hevc-dovi-rpu-scan.patch
          cp "$GITHUB_WORKSPACE/build/dolby-vision/ffmpeg-dovi-split-prerequisites.patch" \
            packages/ffmpeg-8997-dovi-split-prerequisites.patch
          cp "$GITHUB_WORKSPACE/build/dolby-vision/ffmpeg-dovi-split-registration.patch" \
            packages/ffmpeg-8998-dovi-split-registration.patch
          cp "$GITHUB_WORKSPACE/build/dolby-vision/ffmpeg-dovi-dual-track-stream-group.patch" \
            packages/ffmpeg-8999-dovi-dual-track-stream-group.patch
          cp "$GITHUB_WORKSPACE/build/dolby-vision/ffmpeg-mpegts-dovi-stream-group.patch" \
            packages/ffmpeg-8999a-mpegts-dovi-stream-group.patch
          cp "$GITHUB_WORKSPACE/build/core-candidate/ffmpeg-8800-truehd-mat-padding.patch" \
            packages/ffmpeg-9010-truehd-mat-padding.patch
          cp "$GITHUB_WORKSPACE/build/av3a/davs2-const-correctness.patch" \
            packages/davs2-9000-const-correctness.patch
          cp "$GITHUB_WORKSPACE/build/av3a/davs2-error-recovery.patch" \
            packages/davs2-9001-error-recovery.patch

          python3 - <<'PY'
          from pathlib import Path

          packages = Path("packages/CMakeLists.txt")
          text = packages.read_text()
          av3a_entry = "    avs3-audiodec\n"
          if av3a_entry not in text:
              anchor = "    ffmpeg\n"
              if anchor not in text:
                  raise SystemExit("Could not locate ffmpeg package-list anchor")
              text = text.replace(anchor, av3a_entry + anchor, 1)
              packages.write_text(text)

          ffmpeg = Path("packages/ffmpeg.cmake")
          text = ffmpeg.read_text()
          dependency = "        avs3-audiodec\n"
          if dependency not in text:
              anchor = "    DEPENDS\n"
              if anchor not in text:
                  raise SystemExit("Could not locate FFmpeg dependency anchor")
              text = text.replace(anchor, anchor + dependency, 1)

          upstream = "    GIT_REPOSITORY https://github.com/FFmpeg/FFmpeg.git\n"
          fork = "    GIT_REPOSITORY https://github.com/llawsxx/FFmpeg.git\n"
          if upstream in text:
              text = text.replace(upstream, fork, 1)
          elif fork not in text:
              raise SystemExit("Could not locate FFmpeg repository")

          tag = "    GIT_TAG 18c01ad424ca7712ef9a9d46953308efc75c4776\n"
          if tag not in text:
              text = text.replace(fork, fork + tag, 1)

          patch_files = [
              "ffmpeg-8995-hevc-missing-ref-foll.patch",
              "ffmpeg-8996-hevc-dovi-rpu-scan.patch",
              "ffmpeg-8997-dovi-split-prerequisites.patch",
              "ffmpeg-8998-dovi-split-registration.patch",
              "ffmpeg-8999-dovi-dual-track-stream-group.patch",
              "ffmpeg-8999a-mpegts-dovi-stream-group.patch",
              "ffmpeg-9000-libarcdav3a-hardening.patch",
              "ffmpeg-9004-libarcdav3a-spatial.patch",
              "ffmpeg-9006-libarcdav3a-preselections.patch",
              "ffmpeg-9001-av3a-multiframe-probe.patch",
              "ffmpeg-9002-av3a-frame-parser.patch",
              "ffmpeg-9003-nvenc-sdk-13.1.patch",
              "ffmpeg-9005-bluray-hdmv-context.patch",
              "ffmpeg-9010-truehd-mat-padding.patch",
          ]
          patch = (
              "    PATCH_COMMAND ${CMAKE_COMMAND} -E copy "
              "${CMAKE_CURRENT_SOURCE_DIR}/ffmpeg-8998-dovi-split.c "
              "libavcodec/bsf/dovi_split.c\n"
          )
          for patch_file in patch_files:
              command = "        COMMAND"
              patch += (
                  command + " ${EXEC} git apply --check "
                  "${CMAKE_CURRENT_SOURCE_DIR}/" + patch_file + "\n"
                  "        COMMAND ${EXEC} git apply "
                  "${CMAKE_CURRENT_SOURCE_DIR}/" + patch_file + "\n"
              )
          if "ffmpeg-9000-libarcdav3a-hardening.patch" not in text:
              anchor = '    UPDATE_COMMAND ""\n'
              if anchor not in text:
                  raise SystemExit("Could not locate FFmpeg update anchor")
              text = text.replace(anchor, anchor + patch, 1)

          option = "        --enable-libarcdav3a\n"
          if option not in text:
              anchor = "        --enable-libplacebo\n"
              if anchor not in text:
                  raise SystemExit("Could not locate FFmpeg configure anchor")
              text = text.replace(anchor, anchor + option, 1)

          ffmpeg.write_text(text)

          davs2 = Path("packages/davs2.cmake")
          text = davs2.read_text()
          upstream = "    GIT_REPOSITORY https://github.com/saindriches/davs2.git\n"
          fork = "    GIT_REPOSITORY https://github.com/llawsxx/davs2-10bit.git\n"
          if upstream in text:
              text = text.replace(upstream, fork, 1)
          elif fork not in text:
              raise SystemExit("Could not locate davs2 repository")

          tag = "    GIT_TAG b42ffca966970dc788f8c57549bee038b2974346\n"
          if tag not in text:
              text = text.replace(fork, fork + tag, 1)

          patch = (
              "    PATCH_COMMAND ${EXEC} git apply --check "
              "${CMAKE_CURRENT_SOURCE_DIR}/"
              "davs2-9000-const-correctness.patch\n"
              "        COMMAND ${EXEC} git apply "
              "${CMAKE_CURRENT_SOURCE_DIR}/"
              "davs2-9000-const-correctness.patch\n"
              "        COMMAND ${EXEC} git apply --check "
              "${CMAKE_CURRENT_SOURCE_DIR}/"
              "davs2-9001-error-recovery.patch\n"
              "        COMMAND ${EXEC} git apply "
              "${CMAKE_CURRENT_SOURCE_DIR}/"
              "davs2-9001-error-recovery.patch\n"
          )
          if "davs2-9000-const-correctness.patch" not in text:
              anchor = '    UPDATE_COMMAND ""\n'
              if anchor not in text:
                  raise SystemExit("Could not locate davs2 update anchor")
              text = text.replace(anchor, anchor + patch, 1)

          davs2.write_text(text)
          PY

          sed -i \
            "/GIT_REPOSITORY https:\\/\\/github.com\\/mpv-player\\/mpv.git/a\\    GIT_TAG $MPV_COMMIT" \
            packages/mpv.cmake
          sed -i \
            's#https://git.videolan.org/git/ffmpeg/nv-codec-headers.git#https://github.com/FFmpeg/nv-codec-headers.git#' \
            packages/nvcodec-headers.cmake
          sed -i \
            "s/GIT_TAG SDL2/GIT_TAG $SDL2_COMMIT/" \
            packages/libsdl2.cmake
          # A pinned commit is checked out detached. Leaving GIT_REMOTE_NAME
          # set makes winbuild's force-update helper try to resolve @{u}.
          sed -i \
            '/^[[:space:]]*GIT_REMOTE_NAME origin$/d' \
            packages/libsdl2.cmake
          sed -i \
            "/GIT_REPOSITORY https:\\/\\/github.com\\/rockdaboot\\/libpsl.git/a\\    GIT_TAG $LIBPSL_COMMIT" \
            packages/libpsl.cmake
          sed -i \
            "/GIT_REPOSITORY https:\\/\\/github.com\\/curl\\/curl.git/a\\    GIT_TAG $CURL_COMMIT" \
            packages/curl.cmake
          # libssh master removed the legacy ssh_scp typedef on 9/3 while the
          # pinned curl release still consumes it. Keep the exact libssh
          # revision used by the last successful formal build.
          sed -i \
            "/GIT_REPOSITORY https:\\/\\/gitlab.com\\/libssh\\/libssh-mirror.git/a\\    GIT_TAG $LIBSSH_COMMIT" \
            packages/libssh.cmake

          # OpenSSL incorporated winbuild's MinGW SIO_UDP_NETRESET workaround
          # upstream. Pin the last known-good source used by the 8/29 formal
          # build and stop reapplying the now-duplicate mailbox patch.
          sed -i \
            "/GIT_REPOSITORY https:\\/\\/github.com\\/openssl\\/openssl.git/a\\    GIT_TAG $OPENSSL_COMMIT" \
            packages/openssl.cmake
          sed -i '/PATCH_COMMAND.*openssl-.*\.patch/d' packages/openssl.cmake

          # The Windows release must use Schannel so certificate verification
          # follows the Windows trust store, matching the proven 7/17 build.
          sed -i \
            's/-DCURL_USE_OPENSSL=ON/-DCURL_USE_OPENSSL=OFF/' \
            packages/curl.cmake
          sed -i \
            '/-DCURL_USE_OPENSSL=OFF/a\        -DCURL_USE_SCHANNEL=ON' \
            packages/curl.cmake

          # ECH is not available through Schannel in this build. Normal
          # HTTP/HTTPS, Windows CA, redirects, ranges and request headers remain.
          sed -i \
            's/-DUSE_ECH=ON/-DUSE_ECH=OFF/' \
            packages/curl.cmake

          test -f packages/curl.cmake
          grep -Eq '^[[:space:]]*curl[[:space:]]*$' packages/mpv.cmake
          grep -Fq -- '-Dlibcurl=enabled' packages/mpv.cmake
          grep -Fq -- '-Dsdl2-audio=enabled' packages/mpv.cmake
          grep -Fq -- '-Dsdl2-gamepad=enabled' packages/mpv.cmake
          grep -Fq -- '-Dwin32-smtc=enabled' packages/mpv.cmake
          grep -Fq '        cppwinrt' packages/mpv.cmake
          grep -Fq "GIT_TAG $CPPWINRT_COMMIT" toolchain/cppwinrt.cmake
          if grep -Fq 'cleanup(cppwinrt install)' toolchain/cppwinrt.cmake; then
            echo "::error::cppwinrt generator would be deleted before header staging"
            exit 1
          fi
          grep -Fq "GIT_TAG $SDL2_COMMIT" packages/libsdl2.cmake
          grep -Fq "GIT_TAG $LIBPSL_COMMIT" packages/libpsl.cmake
          grep -Fq "GIT_TAG $CURL_COMMIT" packages/curl.cmake
          grep -Fq "GIT_TAG $LIBSSH_COMMIT" packages/libssh.cmake
          grep -Fq "GIT_TAG $OPENSSL_COMMIT" packages/openssl.cmake
          if grep -Fq 'PATCH_COMMAND' packages/openssl.cmake; then
            echo "::error::obsolete OpenSSL MinGW patch is still enabled"
            exit 1
          fi
          if grep -Fq 'GIT_REMOTE_NAME origin' packages/libsdl2.cmake; then
            echo "::error::pinned SDL2 still uses branch-only force-update"
            exit 1
          fi
          grep -n 'PATCH_COMMAND.*sdl2-9000' packages/libsdl2.cmake
          grep -Fq 'sdl2-9001-spatial-channel-counts.patch' \
            packages/libsdl2.cmake
          grep -Fq 'WASAPI_ApplySpatialSpeakerMask' \
