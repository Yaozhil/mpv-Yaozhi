          grep -Fq 'LinkRSM stayed in the menu' "$candidate_mpv_patch"
          grep -Fq 'last_drain_discontinuity_id' "$candidate_mpv_patch"
          grep -Fq 'bool force_sdr = !tagged_overlay && src' "$candidate_mpv_patch"
          grep -Fq 'NAV_PLAYBACK_READAHEAD_SECS 2.0' "$candidate_mpv_patch"
