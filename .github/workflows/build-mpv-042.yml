          grep -Fq 'add_library(RendererCore STATIC' \
            packages/avs3-renderer-build.patch
          grep -Fq 'install(TARGETS RendererCore avs3_samplerate' \
            packages/avs3-renderer-build.patch
          grep -Fq 'avs3-renderer-hardening.patch' packages/avs3-audiodec.cmake
          grep -Fq 'avs3-normalize-source-eol.py' packages/avs3-audiodec.cmake
          grep -Fq -- '-DAVS3_BUILD_RENDERER=ON' packages/avs3-audiodec.cmake
          grep -Fq -- \
            '-DRENDERER_ROOT=<SOURCE_DIR>/av3a_binaural_render/AudioDecoder/av3a_binaural_render' \
            packages/avs3-audiodec.cmake
          grep -n -A4 -B2 'llawsxx/davs2-10bit' packages/davs2.cmake
          grep -Fq "GIT_TAG $DAVS2_COMMIT" packages/davs2.cmake
          grep -n 'PATCH_COMMAND.*davs2-9000' packages/davs2.cmake
          grep -Fq 'davs2-9001-error-recovery.patch' packages/davs2.cmake
          grep -Fq 'decode_lcu_parse(h, i_level_next' \
            packages/davs2-9001-error-recovery.patch
          grep -Fq 'decode_lcu_recon(h, row_rec, i_level_next' \
            packages/davs2-9001-error-recovery.patch
          grep -Fq 'h->decoding_error == 0 && h->rps.refered_by_others' \
            packages/davs2-9001-error-recovery.patch
          grep -n -A4 -B4 -- '-Dlibcurl=enabled' packages/mpv.cmake
          grep -n -A4 -B4 -- '-Dwin32-smtc=enabled' packages/mpv.cmake
          grep -n -A12 -B4 -- '-DCURL_USE_OPENSSL=OFF' packages/curl.cmake
          grep -n 'GIT_REPOSITORY.*nv-codec-headers' packages/nvcodec-headers.cmake
          grep -Fq "GIT_TAG $MPV_COMMIT" packages/mpv.cmake
          grep -Fqx 'audio-device=auto' "$GITHUB_WORKSPACE/portable_config/mpv.conf"

      - name: Check out pinned ASIO headers
        if: matrix.variant == 'atmos'
        uses: actions/checkout@v6
        with:
          repository: audiosdk/asio
          ref: 496a0765b8bb9c26f764f22f9a9712a937177db2
          path: third-party/asio

      - name: Preserve common features and prepare variant
        shell: bash
        run: |
          set -euxo pipefail
          # Old source gates continue to use their complete original config,
          # including its frozen workflow identity. The appended speaker layer
          # independently binds this current workflow and new build inputs.
          timeout --foreground --kill-after=20s 120s \
            git fetch --no-tags --depth=1 origin df1084fc3bd41d372acb789508334c95391db645
          python3 build/atmos/parity/test-speakers-source-gate.py \
            --output "speakers-gate-contract-${{ matrix.variant }}.json"
          python3 build/atmos/parity/test-speakers-build-gate.py \
            --output "speakers-build-gate-contract-${{ matrix.variant }}.json"
          python3 "$LEGACY_SPEAKER_CONFIG/build/atmos/parity/verify-speakers-source.py" \
            --prepare-legacy-config legacy-network-config
          python3 build/atmos/parity/prepare-speakers-winbuild.py \
            --winbuild winbuild/mpv-winbuild-cmake \
            --variant '${{ matrix.variant }}' \
            --asio-sdk "$GITHUB_WORKSPACE/third-party/asio"
          python3 "$NATIVE_REFRESH_PARENT_CONFIG/build/atmos/parity/prepare-native-refresh-winbuild.py" \
            --winbuild winbuild/mpv-winbuild-cmake --variant '${{ matrix.variant }}'
          python3 "$NATIVE_REFRESH_PARENT_CONFIG/build/atmos/parity/test-native-refresh-source-gate.py" \
            --output "native-refresh-gate-contract-${{ matrix.variant }}"
          python3 build/atmos/parity/prepare-native-freeze-winbuild.py \
            --winbuild winbuild/mpv-winbuild-cmake --variant '${{ matrix.variant }}'

      - name: Apply and verify reviewed 0.42 source and dependency overlay
        shell: bash
        run: |
          set -euxo pipefail
          python3 build/mpv-042/prepare-winbuild.py \
            --winbuild winbuild/mpv-winbuild-cmake --variant '${{ matrix.variant }}'
          # Freeze the effective 0.42 recipe inventory only after the reviewed
          # non-render overlays and mpv/FFmpeg recipe adaptation are complete.
          python3 build/atmos/parity/prepare-dependency-lock.py \
            --winbuild winbuild/mpv-winbuild-cmake --variant '${{ matrix.variant }}'
          python3 build/atmos/parity/test-dependency-build-gate.py \
            --output "dependency-gate-contract-${{ matrix.variant }}.json"
          python3 build/mpv-042/verify-source.py \
            --prepare-preflight --variant '${{ matrix.variant }}' \
            --work "$RUNNER_TEMP/mpv-042-preflight" --output "mpv-042-preflight-${{ matrix.variant }}.json"

      - name: Verify preserved native timing CPU contracts
        shell: bash
        run: |
          set -euxo pipefail
          python3 build/mpv-042/cpu/run_cpu_contracts.py \
            --source "$RUNNER_TEMP/mpv-042-preflight" --variant '${{ matrix.variant }}' --cc gcc \
            --output "mpv-042-cpu-${{ matrix.variant }}.json"

      - name: Restore reusable build cache
        id: build-cache
        uses: actions/cache@v5
        with:
          path: |
            winbuild/mpv-winbuild-cmake/build64
            winbuild/mpv-winbuild-cmake/src_packages
            winbuild/mpv-winbuild-cmake/install_rustup
            .ccache
          # A dependency lock is a cache boundary. Never restore an older
          # dependency generation or the other variant's patched source cache.
          key: mpv-042-dependency-${{ matrix.variant }}-${{ hashFiles('build/mpv-042/**') }}
          # Reuse only the installed CI5 generation with the same variant and
          # unchanged dependency lock. Patched source/install outputs are still
          # invalidated and checked by the original steps below.
          restore-keys: |
            mpv-dependency-v1-${{ matrix.variant }}-${{ hashFiles('build/atmos/parity/dependency-lock.json') }}-0de3ddda45699db0d4de4121067295ba343f4f0d483e35ba4460fa7cda46e945
            mpv-dependency-v1-${{ matrix.variant }}-${{ hashFiles('build/atmos/parity/dependency-lock.json') }}-56943bbea6e3ec85092959d1bc75df73659270469c2b573cc444bff0d2d85aae

      - name: Reset cached patched sources before building
        shell: bash
        run: |
          set -euxo pipefail
          cd winbuild/mpv-winbuild-cmake

          # winbuild applies package changes with `git am`. Its cache stores
          # source trees, so a failed or interrupted prior run can leave any
          # patched package mid-series. Recreate exactly the package sources
          # that define PATCH_COMMANDs; unpatched and expensive dependencies
          # remain cached.
          for package_file in packages/*.cmake; do
            package="$(basename "$package_file" .cmake)"
            if grep -q 'PATCH_COMMAND' "$package_file"; then
              rm -rf "src_packages/$package" \
                "build64/packages/${package}-prefix"
            fi
          done
          # OpenSSL no longer has a PATCH_COMMAND because the required MinGW
          # workaround is upstream. Recreate it explicitly so a restored cache
          # cannot reuse a different unpinned source revision.
          rm -rf src_packages/openssl build64/packages/openssl-prefix
          # This appended static renderer must produce a fresh compiler/archive
          # receipt even when the expensive older dependency cache is restored.
          rm -rf src_packages/libspatialaudio build64/packages/libspatialaudio-prefix speaker-evidence
          rm -f build64/install/x86_64-w64-mingw32/lib/libspatialaudio.a
          rm -rf build64/packages/mpv-release-prefix \
            build64/packages/mpv-packaging-prefix \
            build64/mpv-x86_64-* \
            release/mpv-x86_64-*
          rm -f release/mpv-x86_64-*.7z \
            install/x86_64-w64-mingw32/bin/mpv.exe \
            install/x86_64-w64-mingw32/bin/mpv.com

          # Reject unidentified cache contents, then rebuild the locked
          # rendering inputs and archive even after an exact cache hit.
          python3 "$GITHUB_WORKSPACE/build/atmos/parity/verify-dependency-build.py" \
            --winbuild "$PWD" --variant '${{ matrix.variant }}' --phase cache

          # FFmpeg's patched headers and executable can be rebuilt while an
          # older static libavformat archive remains in the shared install
          # prefix. That lets mpv link 62.13.101 even though the FFmpeg
          # validation binary reports 62.13.102, silently disabling the
          # backported Dolby Vision stream-group handler. Remove only the
          # FFmpeg install outputs so the next mpv link cannot reuse them.
          rm -f \
            install/x86_64-w64-mingw32/bin/ffmpeg.exe \
            install/x86_64-w64-mingw32/bin/ffprobe.exe \
            install/x86_64-w64-mingw32/bin/ffplay.exe \
            install/x86_64-w64-mingw32/lib/libavcodec.* \
            install/x86_64-w64-mingw32/lib/libavdevice.* \
            install/x86_64-w64-mingw32/lib/libavfilter.* \
            install/x86_64-w64-mingw32/lib/libavformat.* \
            install/x86_64-w64-mingw32/lib/libavutil.* \
            install/x86_64-w64-mingw32/lib/libpostproc.* \
            install/x86_64-w64-mingw32/lib/libswresample.* \
            install/x86_64-w64-mingw32/lib/libswscale.*
          rm -rf \
            install/x86_64-w64-mingw32/include/libavcodec \
            install/x86_64-w64-mingw32/include/libavdevice \
            install/x86_64-w64-mingw32/include/libavfilter \
            install/x86_64-w64-mingw32/include/libavformat \
            install/x86_64-w64-mingw32/include/libavutil \
            install/x86_64-w64-mingw32/include/postproc \
            install/x86_64-w64-mingw32/include/libswresample \
            install/x86_64-w64-mingw32/include/libswscale

      - name: Preflight and build libcurl dependency chain
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euxo pipefail
          # The runner's rolling CMake release regressed this pinned
          # winbuild's cppwinrt ExternalProject install command.
          export PATH=/usr/bin:$PATH
          cd winbuild/mpv-winbuild-cmake

          cmake -Wno-dev --fresh \
            -DTARGET_ARCH=x86_64-w64-mingw32 \
            -DCOMPILER_TOOLCHAIN=gcc \
            -DENABLE_CCACHE=ON \
            -DSINGLE_SOURCE_LOCATION="$PWD/src_packages" \
            -DRUSTUP_LOCATION="$PWD/install_rustup" \
            -G Ninja \
            -S . \
            -B build64

          # ExternalProject fans out dozens of public Git clones. Hosted
          # runners can be throttled when all of them start together, so keep
          # the network phase bounded, low-concurrency and retry only the
          # unfinished stamp targets.
          download_complete=no
          for attempt in 1 2 3; do
            if timeout --foreground 20m ninja -j2 -C build64 download; then
              download_complete=yes
              break
            fi
            echo "::warning::Dependency download attempt ${attempt}/3 failed; retrying unfinished sources"
            sleep $((attempt * 15))
          done
          test "$download_complete" = yes
          # Reproduce the prior binary's fontconfig inputs, not today's main.
          test "$(git -C src_packages/fontconfig rev-parse HEAD)" = b25ffeabd15b76f86c0c6736f6df2f1b89858010
          test "$(git -C src_packages/fontconfig rev-parse 'HEAD^{tree}')" = 048191d4358f4b4d57c050750a6fca8c3dda6ad2
          test "$(git -C src_packages/openssl rev-parse HEAD)" = "$OPENSSL_COMMIT"
          grep -Fq '#if defined(__MINGW32__) && !defined(SIO_UDP_NETRESET)' \
            src_packages/openssl/ssl/quic/quic_reactor.c
          grep -Fq '#define SIO_UDP_NETRESET _WSAIOW(IOC_VENDOR, 15)' \
            src_packages/openssl/ssl/quic/quic_reactor.c
          # Capture the real selected graph and newly generated MinGW inputs
          # before any compiler/CRT target may build or reuse cached products.
          python3 "$GITHUB_WORKSPACE/build/mpv-042/dependencies/check_candidate_dependencies.py" \
            --winbuild "$PWD" --variant '${{ matrix.variant }}' \
            --dependencies "$GITHUB_WORKSPACE/build/mpv-042/dependencies/dependency-provenance.json" \
            --print-required-download-targets > "$RUNNER_TEMP/mpv-042-required-downloads.txt"
          mapfile -t required_downloads < "$RUNNER_TEMP/mpv-042-required-downloads.txt"
          test "${#required_downloads[@]}" -gt 0
          timeout --foreground --kill-after=2m 20m ninja -j2 -C build64 "${required_downloads[@]}"
          python3 "$GITHUB_WORKSPACE/build/mpv-042/verify-dependencies.py" \
            --winbuild "$PWD" --variant '${{ matrix.variant }}' --phase configured \
            --output "$GITHUB_WORKSPACE/mpv-042-dependencies-configured-${{ matrix.variant }}.json"

          # Preserve download/update/patch evidence, but force a new CRT build
          # from the reviewed generation. Keep unrelated toolchain targets.
          crt_prefix="$PWD/build64/toolchain/mingw-w64-crt-prefix"
          crt_stamp="$crt_prefix/src/mingw-w64-crt-stamp"
          crt_build="$crt_prefix/src/mingw-w64-crt-build"
          test "$(realpath -m "$crt_prefix")" = "$PWD/build64/toolchain/mingw-w64-crt-prefix"
          test -d "$crt_stamp"
          for phase in autoreconf configure build install postremovebuild done; do
            rm -f "$crt_stamp/mingw-w64-crt-$phase"
          done
          rm -f "$PWD/build64/CMakeFiles/mingw-w64-crt-complete"
          rm -rf "$crt_build"
          mkdir -p "$crt_build"
          timeout --foreground --kill-after=2m 60m ninja -C build64 mingw-w64-crt
          python3 "$GITHUB_WORKSPACE/build/mpv-042/verify-dependencies.py" \
            --winbuild "$PWD" --variant '${{ matrix.variant }}' --phase crt-built \
            --output "$GITHUB_WORKSPACE/mpv-042-dependencies-crt-${{ matrix.variant }}.json"
          timeout --foreground --kill-after=2m 30m ninja -C build64 gcc

          # curl is pinned to the already verified Schannel build. Reusing its
          # source/prefix avoids a fresh network update, which can leave the
          # hosted runner in a silent ExternalProject wait. A cold cache still
          # gets the normal update/build path, but both network-sensitive steps
          # have a finite bound.
          curl_done=build64/packages/curl-prefix/src/curl-stamp/curl-done
          if [ -f "$curl_done" ]; then
            echo "Reusing cached libcurl Schannel build"
          else
            # All curl inputs have explicit pins. A global update would also
            # advance unrelated branch-based dependencies behind our back.
            timeout --foreground 25m ninja -j2 -C build64 \
              curl-force-update libpsl-force-update libssh-force-update openssl-force-update
            if ! timeout --foreground 25m ninja -C build64 curl; then
              for log in \
                build64/packages/curl-prefix/src/curl-stamp/curl-configure-out.log \
                build64/packages/curl-prefix/src/curl-stamp/curl-configure-err.log \
                build64/packages/curl-prefix/src/curl-stamp/curl-build-out.log \
                build64/packages/curl-prefix/src/curl-stamp/curl-build-err.log; do
                if [ -f "$log" ]; then
                  echo "::group::$log"
                  tail -n 200 "$log"
                  echo "::endgroup::"
                fi
              done
              exit 1
            fi
          fi

          curl_config_log=build64/packages/curl-prefix/src/curl-stamp/curl-configure-out.log
          test -f "$curl_config_log"
          grep -Fq -- 'Enabled SSL backends: Schannel' "$curl_config_log"
          if grep -Fq -- 'Enabled SSL backends: OpenSSL' "$curl_config_log"; then
            echo "::error::libcurl unexpectedly configured with OpenSSL"
            exit 1
          fi
          grep -F -- 'Features:' "$curl_config_log"
          grep -F -- 'Enabled SSL backends:' "$curl_config_log"

      - name: Build and stage pinned C++ WinRT headers
        shell: bash
        run: |
          set -euxo pipefail
          export PATH=/usr/bin:$PATH
          cd winbuild/mpv-winbuild-cmake

          # A restored cache can contain the old completed cleanup stamp but no
          # generator binary. Recreate this one bounded intermediate exactly.
          rm -rf build64/toolchain/cppwinrt-prefix
          timeout --foreground --kill-after=2m 30m ninja -C build64 cppwinrt
          cppwinrt_bin="$(find build64/toolchain/cppwinrt-prefix/src/cppwinrt-build \
            -maxdepth 2 -type f -name cppwinrt -perm -u+x -print -quit)"
          test -n "$cppwinrt_bin"

          winmd=build64/toolchain/cppwinrt-prefix/src/cppwinrt-build/Windows.winmd
          curl --fail --location --retry 3 --connect-timeout 30 \
            --max-time 300 \
            "https://raw.githubusercontent.com/microsoft/windows-rs/$WINDOWS_RS_COMMIT/crates/libs/default/Windows.winmd" \
            --output "$winmd"
          echo "$WINDOWS_WINMD_SHA256  $winmd" | sha256sum --check --strict

          include_root=build64/install/x86_64-w64-mingw32/include
          "$cppwinrt_bin" -input "$winmd" -output "$include_root"
          test -f "$include_root/winrt/base.h"
          test -f "$include_root/winrt/Windows.Foundation.h"
          test -f "$include_root/winrt/Windows.Media.h"

      - name: Build and verify AV3A decoder dependency
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euxo pipefail
          export PATH=/usr/bin:$PATH
          cd winbuild/mpv-winbuild-cmake

          ninja -C build64 avs3-audiodec

          av3a_lib=build64/install/x86_64-w64-mingw32/lib/libAVS3AudioDec.a
          renderer_lib=build64/install/x86_64-w64-mingw32/lib/libRendererCore.a
          samplerate_lib=build64/install/x86_64-w64-mingw32/lib/libavs3_samplerate.a
          test -f "$av3a_lib"
          test -f "$renderer_lib"
          test -f "$samplerate_lib"
          test -f \
            build64/install/x86_64-w64-mingw32/include/avs3a/avs3_spatial_metadata.h
          test -f \
            build64/install/x86_64-w64-mingw32/include/avs3-renderer/avs3_audio.h
          nm -g --defined-only "$av3a_lib" > avs3-audiodec-symbols.txt
          nm -g --defined-only "$renderer_lib" > avs3-renderer-symbols.txt
          for symbol in \
            avs3_create_decoder \
            avs3_destroy_decoder \
            parse_header \
            avs3_decode \
            avs3_get_spatial_stream_info \
            avs3_get_spatial_frame; do
            grep -Eq "[[:space:]]_?${symbol}$" avs3-audiodec-symbols.txt
          done
          for symbol in \
            audio_create_context \
            audio_destroy \
            audio_submit_ambisonic_channel_buffer \
            audio_submit_interleaved_ambisonic_buffer; do
            grep -Eq "[[:space:]]_?${symbol}$" avs3-renderer-symbols.txt
          done

          av3a_prefix=build64/install/x86_64-w64-mingw32
          build64/install/bin/cross-gcc \
            -std=c99 -O2 -Wall -Wextra -Werror \
            -I"$av3a_prefix/include/avs3a" \
            "$GITHUB_WORKSPACE/build/av3a/tests/object-metadata-probe.c" \
            "$av3a_lib" -lm \
            -o object-metadata-probe.exe
          test -f object-metadata-probe.exe

      - name: Build static x86-64 mpv
        id: build
        continue-on-error: true
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euxo pipefail
          export PATH=/usr/bin:$PATH
          cd winbuild/mpv-winbuild-cmake

          # Reapply the current package patch chain without invoking the
          # winbuild helper's unconditional `ninja update` remote fetch.
          # AV3A was freshly rebuilt and verified in the preceding step.
          # Preserve those exact patched sources and stamps for the identity
          # gate; fullclean would restore tracked files but retain the new
          # untracked CMakeLists, causing a second patch application to fail.
          for package in davs2 ffmpeg libpsl libsdl2 mpv; do
            stamp_dir="build64/packages/${package}-prefix/src/${package}-stamp"
            if [ -d "$stamp_dir" ]; then
              ninja -C build64 "${package}-fullclean"
              touch "$stamp_dir/${package}-download" "$stamp_dir/${package}-update"
            fi
          done

          build_marker="$(mktemp)"
          touch "$build_marker"

          timeout --foreground --kill-after=2m 180m ninja -C build64 mpv

          mkdir -p release
          built_dir="$(find build64 -maxdepth 1 -type d -name 'mpv-x86_64-*' -print -quit)"
          test -n "$built_dir"
          test -f "$built_dir/mpv.exe"
          test -f "$built_dir/mpv.com"
          test "$built_dir/mpv.exe" -nt "$build_marker"
          test "$built_dir/mpv.com" -nt "$build_marker"
          test "$(git -C src_packages/fontconfig rev-parse 'HEAD^{tree}')" = 4b2a40143653a0b158a374fe513e8d603e3cbe04
          test -z "$(git -C src_packages/fontconfig status --porcelain --untracked-files=no)"
          cp -a "$built_dir" release/
          7z a -m0=lzma2 -mx=9 -ms=on "release/$(basename "$built_dir").7z" "$built_dir"/* -x!*.7z

      - name: Bind exact compiled 0.42 source and dependencies
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          winbuild="$GITHUB_WORKSPACE/winbuild/mpv-winbuild-cmake"
          python3 build/mpv-042/verify-source.py --source "$winbuild/src_packages/mpv" \
            --variant '${{ matrix.variant }}' --compiled --winbuild "$winbuild" \
            --output "mpv-042-compiled-source-${{ matrix.variant }}.json"
          python3 build/mpv-042/verify-dependencies.py --winbuild "$winbuild" \
            --variant '${{ matrix.variant }}' --phase compiled \
            --output "mpv-042-dependencies-compiled-${{ matrix.variant }}.json"
          python3 build/atmos/parity/verify-dependency-build.py --winbuild "$winbuild" \
            --variant '${{ matrix.variant }}' --phase final \
            --binary "$(find "$winbuild/build64" -maxdepth 2 -type f -name mpv.exe -print -quit)" \
            --binary "$(find "$winbuild/build64" -maxdepth 2 -type f -name mpv.com -print -quit)" \
            --output "mpv-042-rendering-dependencies-${{ matrix.variant }}.json"

      - name: Collect failed build logs
        if: always() && !cancelled() && (failure() || steps.build.outcome == 'failure')
        shell: bash
        run: |
          find winbuild/mpv-winbuild-cmake/build64 -type f \
            \( -iname '*-*.log' -o -path '*/ffbuild/config.log' \) \
            -print > build-log-files.txt
          7za a build-logs.7z @build-log-files.txt

      - name: Upload failed build logs
        if: always() && !cancelled() && (failure() || steps.build.outcome == 'failure')
        uses: actions/upload-artifact@v6
        with:
          name: mpv-v100-${{ matrix.variant }}-build-logs
          path: |
            build-logs.7z
            build-log-files.txt
          if-no-files-found: error
          retention-days: 7

      - name: Stop after failed build
        if: always() && !cancelled() && (failure() || steps.build.outcome == 'failure')
        run: exit 1

      - name: Package and bind candidate artifacts
        shell: bash
        run: |
          set -euxo pipefail
          python3 build/mpv-042/package.py --winbuild winbuild/mpv-winbuild-cmake \
            --variant '${{ matrix.variant }}' --output artifact

      - name: Upload source and provenance receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mpv-042-provenance-${{ matrix.variant }}
          include-hidden-files: true
          path: |
            mpv-042-*.json
            winbuild/mpv-winbuild-cmake/dependency-evidence/
            winbuild/mpv-winbuild-cmake/speaker-evidence/
            winbuild/mpv-winbuild-cmake/mpv-042-evidence/
            build/mpv-042/
          if-no-files-found: error
          retention-days: 30

      - name: Upload reviewed candidate binaries
        uses: actions/upload-artifact@v6
        with:
          name: mpv-042-${{ matrix.variant }}-x86_64
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
