          grep -Fq "MKTAG('v','d','e','p')" \
            packages/ffmpeg-8999-dovi-dual-track-stream-group.patch
          grep -Fq 'AV_STREAM_GROUP_PARAMS_DOLBY_VISION' \
            packages/ffmpeg-8999-dovi-dual-track-stream-group.patch
          grep -Fq 'M2TS_VIDEO_EL_PID' \
            packages/ffmpeg-8999a-mpegts-dovi-stream-group.patch
          grep -Fq 'dependency_pid' \
            packages/ffmpeg-8999a-mpegts-dovi-stream-group.patch
          grep -Fq 'ffmpeg-8999-dovi-dual-track-stream-group.patch' \
            packages/ffmpeg.cmake
          grep -Fq 'ffmpeg-9010-truehd-mat-padding.patch' \
            packages/ffmpeg.cmake
          grep -n -A8 -B2 'Sourcecodeforplayer' packages/avs3-audiodec.cmake
          grep -Fq 'av3a_binaural_render/AudioDecoder/av3a_binaural_render' \
