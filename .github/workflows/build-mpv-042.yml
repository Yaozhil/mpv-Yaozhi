            exit 1
          fi
          if grep -Eq 'ngtcp2|nghttp3|USE_NGTCP2=ON|USE_NGHTTP3=ON' \
            packages/CMakeLists.txt packages/curl.cmake; then
            echo "::error::optional HTTP/3 dependencies are still enabled"
            exit 1
          fi
          grep -A5 -B2 'GIT_REPOSITORY.*mpv-player' packages/mpv.cmake
          grep -n 'PATCH_COMMAND.*mpv-' packages/mpv.cmake
          # Fail before the expensive build if the candidate mailbox is
          # incomplete or no longer carries a required private regression fix.
          candidate_mpv_patch=packages/mpv-9000-candidate-c318236.patch
          grep -Fq '[Luna] prepare Blu-ray menu and metadata candidate' "$candidate_mpv_patch"
