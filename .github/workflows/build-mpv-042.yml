          grep -Fq 'expose Profile 7 metadata for authored Blu-ray' "$candidate_mpv_patch"
          grep -Fq 'preserve Profile 7 recovery for authored Blu-ray' "$candidate_mpv_patch"
          grep -Fq 'stream_bluray: wait for delayed BD-J title transitions' "$candidate_mpv_patch"
          grep -Fq 'stream_dvdnav: activate buttons from queued NAV data' "$candidate_mpv_patch"
          grep -Fq 'stream_dvdnav: trace authored button activation' "$candidate_mpv_patch"
          grep -Fq 'stream_dvdnav: recover false-success LinkRSM buttons' "$candidate_mpv_patch"
          grep -Fq '[Luna] demux_disc: wait for async Blu-ray destination' "$candidate_mpv_patch"
          grep -Fq 'demux_disc: avoid nested Blu-ray reopen polling' "$candidate_mpv_patch"
