          grep -n -A4 -B4 -- '--enable-libarcdav3a' packages/ffmpeg.cmake
          grep -Fq 'ffmpeg-9001-av3a-multiframe-probe.patch' packages/ffmpeg.cmake
          grep -Fq 'ffmpeg-9002-av3a-frame-parser.patch' packages/ffmpeg.cmake
          grep -Fq 'ffmpeg-9003-nvenc-sdk-13.1.patch' packages/ffmpeg.cmake
          grep -Fq 'ffmpeg-9004-libarcdav3a-spatial.patch' packages/ffmpeg.cmake
          grep -Fq 'ffmpeg-9006-libarcdav3a-preselections.patch' packages/ffmpeg.cmake
