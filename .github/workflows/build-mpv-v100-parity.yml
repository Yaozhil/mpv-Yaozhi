name: HOLD bootstrap diagnostic workspace
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            winbuild/mpv-winbuild-cmake/build64
            winbuild/mpv-winbuild-cmake/src_packages
            winbuild/mpv-winbuild-cmake/install_rustup
            .ccache
          key: mpv-v100-atmos-ubuntu-gcc64-129b1c81a8d4264a70a90922aaabea3ad37dcdb7aa24fae998bf9daef1ce1faa
          fail-on-cache-miss: true
      - name: Install native build commands
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build pkg-config ccache python3-pip python3-cairo
          python3 -m pip install --break-system-packages meson mako jsonschema roman rst2pdf
      - name: Compile exact HOLD with bounded observation only
        run: python3 bootstrap-input/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-bootstrap-diagnostic
          path: bootstrap-artifact
          retention-days: 14
