name: Build mpv HDR PGS + AV3A

on:
  push:
    branches:
      - codex/hdr-pgs-core-fix
    paths:
      - ".github/workflows/build-mpv-hdr-pgs.yml"
      - "build/av3a/**"
      - "patches/0001-vo_gpu_next-add-image-subtitle-colorspace-control.patch"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MPV_WINBUILD_COMMIT: b4b1088c30e8821e012fd20052de4c2d3a8eaad4
      MPV_WINBUILD_CMAKE_COMMIT: 04283f7e911149809c46bc236a834cf7134ba133
      MPV_COMMIT: 99b4c12cccb4d8d3f72b41944cb6c640e2156650
      DAVS2_COMMIT: b42ffca966970dc788f8c57549bee038b2974346
      SDL2_COMMIT: a2e7c76bda17c853ba93c7d2c9fdddf8a9d621d1

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex gettext git mercurial subversion \
            ninja-build gyp cmake yasm nasm automake pkg-config libtool \
            libtool-bin gcc-multilib g++-multilib clang lld libc++-dev \
            libc++abi-dev libgmp-dev libmpfr-dev libmpc-dev libgcrypt20-dev \
            gperf ragel texinfo autopoint re2c asciidoc python3-pip \
            python3-cairo docbook2x unzip p7zip-full curl wget ccache
          python3 -m pip install --break-system-packages \
            rst2pdf meson mako jsonschema roman
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out configuration and patch
        uses: actions/checkout@v6

      - name: Prepare matching Windows build system
        shell: bash
        run: |
          set -euxo pipefail

          clone_commit() {
            local repository="$1"
            local destination="$2"
            local commit="$3"
            git init "$destination"
            git -C "$destination" remote add origin "$repository"
            git -C "$destination" fetch --depth 1 origin "$commit"
            git -C "$destination" checkout --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$commit"
          }

          clone_commit \
            https://github.com/zhongfly/mpv-winbuild.git \
            winbuild \
            "$MPV_WINBUILD_COMMIT"
          clone_commit \
            https://github.com/shinchiro/mpv-winbuild-cmake.git \
            winbuild/mpv-winbuild-cmake \
            "$MPV_WINBUILD_CMAKE_COMMIT"

          cd winbuild/mpv-winbuild-cmake
          for patch in ../patch/*.patch; do
            if [ "$(basename "$patch")" = \
              "0008-ngtcp2-nghttp3-nghttp2-add-ngtcp2-nghttp3-nghttp2.patch" ]; then
              echo "Skipping optional HTTP/3 patch incompatible with current OpenSSL"
              continue
            fi
            echo "Applying required build patch: $patch"
            git am --3way "$patch"
          done

          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/mpv.cmake")
          text = path.read_text()
          patch_command = (
              "    GIT_CLONE_FLAGS \"\"\n"
              "    PATCH_COMMAND ${EXEC} git am --3way "
              "${CMAKE_CURRENT_SOURCE_DIR}/mpv-*.patch\n"
          )
          if "PATCH_COMMAND ${EXEC} git am --3way ${CMAKE_CURRENT_SOURCE_DIR}/mpv-*.patch" not in text:
              anchor = '    GIT_CLONE_FLAGS "--filter=tree:0"\n'
              if anchor not in text:
                  raise SystemExit("Could not locate mpv GIT_CLONE_FLAGS anchor")
              text = text.replace(anchor, patch_command, 1)

          option = "        -Dsdl2-audio=enabled\n"
          if option not in text:
              anchor = "        -Dsdl2-gamepad=enabled\n"
              if anchor not in text:
                  raise SystemExit("Could not locate SDL2 gamepad option")
              text = text.replace(anchor, anchor + option, 1)

          path.write_text(text)
          PY

          cp "$GITHUB_WORKSPACE/patches/0001-vo_gpu_next-add-image-subtitle-colorspace-control.patch" \
            packages/mpv-9000-image-subs-colorspace.patch

          cp "$GITHUB_WORKSPACE/build/av3a/avs3-audiodec.cmake" \
            packages/avs3-audiodec.cmake
          cp "$GITHUB_WORKSPACE/build/av3a/normalize-source-eol.py" \
            packages/avs3-normalize-source-eol.py
          cp "$GITHUB_WORKSPACE/build/av3a/avs3-audiodec-static-library.patch" \
            packages/avs3-audiodec-9000-static-library.patch
          cp "$GITHUB_WORKSPACE/build/av3a/avs3-audiodecoder-stage2.patch" \
            packages/avs3-audiodec-9001-spatial-metadata.patch
          cp "$GITHUB_WORKSPACE/build/av3a/avs3-renderer-build.patch" \
            packages/avs3-renderer-build.patch
          cp "$GITHUB_WORKSPACE/build/av3a/avs3-renderer-hardening.patch" \
            packages/avs3-renderer-hardening.patch
          cp "$GITHUB_WORKSPACE/build/av3a/ffmpeg-libarcdav3a-hardening.patch" \
            packages/ffmpeg-9000-libarcdav3a-hardening.patch
          cp "$GITHUB_WORKSPACE/build/av3a/ffmpeg-libarcdav3a-spatial.patch" \
            packages/ffmpeg-9004-libarcdav3a-spatial.patch
          cp "$GITHUB_WORKSPACE/build/av3a/ffmpeg-av3a-multiframe-probe.patch" \
            packages/ffmpeg-9001-av3a-multiframe-probe.patch
          cp "$GITHUB_WORKSPACE/build/av3a/ffmpeg-av3a-frame-parser.patch" \
            packages/ffmpeg-9002-av3a-frame-parser.patch
          cp "$GITHUB_WORKSPACE/build/av3a/ffmpeg-nvenc-sdk-13.1.patch" \
            packages/ffmpeg-9003-nvenc-sdk-13.1.patch
          cp "$GITHUB_WORKSPACE/build/av3a/davs2-const-correctness.patch" \
            packages/davs2-9000-const-correctness.patch

          python3 - <<'PY'
          from pathlib import Path

          packages = Path("packages/CMakeLists.txt")
          text = packages.read_text()
          av3a_entry = "    avs3-audiodec\n"
          if av3a_entry not in text:
              anchor = "    ffmpeg\n"
              if anchor not in text:
                  raise SystemExit("Could not locate ffmpeg package-list anchor")
              text = text.replace(anchor, av3a_entry + anchor, 1)
              packages.write_text(text)

          ffmpeg = Path("packages/ffmpeg.cmake")
          text = ffmpeg.read_text()
          dependency = "        avs3-audiodec\n"
          if dependency not in text:
              anchor = "    DEPENDS\n"
              if anchor not in text:
                  raise SystemExit("Could not locate FFmpeg dependency anchor")
              text = text.replace(anchor, anchor + dependency, 1)

          upstream = "    GIT_REPOSITORY https://github.com/FFmpeg/FFmpeg.git\n"
          fork = "    GIT_REPOSITORY https://github.com/llawsxx/FFmpeg.git\n"
          if upstream in text:
              text = text.replace(upstream, fork, 1)
          elif fork not in text:
              raise SystemExit("Could not locate FFmpeg repository")

          tag = "    GIT_TAG 18c01ad424ca7712ef9a9d46953308efc75c4776\n"
          if tag not in text:
              text = text.replace(fork, fork + tag, 1)

          patch_files = [
              "ffmpeg-9000-libarcdav3a-hardening.patch",
              "ffmpeg-9004-libarcdav3a-spatial.patch",
              "ffmpeg-9001-av3a-multiframe-probe.patch",
              "ffmpeg-9002-av3a-frame-parser.patch",
              "ffmpeg-9003-nvenc-sdk-13.1.patch",
          ]
          patch = ""
          for index, patch_file in enumerate(patch_files):
              command = "    PATCH_COMMAND" if index == 0 else "        COMMAND"
              patch += (
                  command + " ${EXEC} git apply --check "
                  "${CMAKE_CURRENT_SOURCE_DIR}/" + patch_file + "\n"
                  "        COMMAND ${EXEC} git apply "
                  "${CMAKE_CURRENT_SOURCE_DIR}/" + patch_file + "\n"
              )
          if "ffmpeg-9000-libarcdav3a-hardening.patch" not in text:
              anchor = '    UPDATE_COMMAND ""\n'
              if anchor not in text:
                  raise SystemExit("Could not locate FFmpeg update anchor")
              text = text.replace(anchor, anchor + patch, 1)

          option = "        --enable-libarcdav3a\n"
          if option not in text:
              anchor = "        --enable-libplacebo\n"
              if anchor not in text:
                  raise SystemExit("Could not locate FFmpeg configure anchor")
              text = text.replace(anchor, anchor + option, 1)

          ffmpeg.write_text(text)

          davs2 = Path("packages/davs2.cmake")
          text = davs2.read_text()
          upstream = "    GIT_REPOSITORY https://github.com/saindriches/davs2.git\n"
          fork = "    GIT_REPOSITORY https://github.com/llawsxx/davs2-10bit.git\n"
          if upstream in text:
              text = text.replace(upstream, fork, 1)
          elif fork not in text:
              raise SystemExit("Could not locate davs2 repository")

          tag = "    GIT_TAG b42ffca966970dc788f8c57549bee038b2974346\n"
          if tag not in text:
              text = text.replace(fork, fork + tag, 1)

          patch = (
              "    PATCH_COMMAND ${EXEC} git apply --check "
              "${CMAKE_CURRENT_SOURCE_DIR}/"
              "davs2-9000-const-correctness.patch\n"
              "        COMMAND ${EXEC} git apply "
              "${CMAKE_CURRENT_SOURCE_DIR}/"
              "davs2-9000-const-correctness.patch\n"
          )
          if "davs2-9000-const-correctness.patch" not in text:
              anchor = '    UPDATE_COMMAND ""\n'
              if anchor not in text:
                  raise SystemExit("Could not locate davs2 update anchor")
              text = text.replace(anchor, anchor + patch, 1)

          davs2.write_text(text)
          PY

          sed -i \
            "/GIT_REPOSITORY https:\\/\\/github.com\\/mpv-player\\/mpv.git/a\\    GIT_TAG $MPV_COMMIT" \
            packages/mpv.cmake
          sed -i \
            's#https://git.videolan.org/git/ffmpeg/nv-codec-headers.git#https://github.com/FFmpeg/nv-codec-headers.git#' \
            packages/nvcodec-headers.cmake
          sed -i \
            "s/GIT_TAG SDL2/GIT_TAG $SDL2_COMMIT/" \
            packages/libsdl2.cmake

          # The Windows release must use Schannel so certificate verification
          # follows the Windows trust store, matching the proven 7/17 build.
          sed -i \
            's/-DCURL_USE_OPENSSL=ON/-DCURL_USE_OPENSSL=OFF/' \
            packages/curl.cmake
          sed -i \
            '/-DCURL_USE_OPENSSL=OFF/a\        -DCURL_USE_SCHANNEL=ON' \
            packages/curl.cmake

          # ECH is not available through Schannel in this build. Normal
          # HTTP/HTTPS, Windows CA, redirects, ranges and request headers remain.
          sed -i \
            's/-DUSE_ECH=ON/-DUSE_ECH=OFF/' \
            packages/curl.cmake

          test -f packages/curl.cmake
          grep -Eq '^[[:space:]]*curl[[:space:]]*$' packages/mpv.cmake
          grep -Fq -- '-Dlibcurl=enabled' packages/mpv.cmake
          grep -Fq -- '-Dsdl2-audio=enabled' packages/mpv.cmake
          grep -Fq -- '-Dsdl2-gamepad=enabled' packages/mpv.cmake
          grep -Fq "GIT_TAG $SDL2_COMMIT" packages/libsdl2.cmake
          if grep -E 'list\(APPEND removed .*"curl"' packages/CMakeLists.txt; then
            echo "::error::curl is still excluded from the mpv dependency graph"
            exit 1
          fi
          grep -Fq -- '-DCURL_USE_OPENSSL=OFF' packages/curl.cmake
          grep -Fq -- '-DCURL_USE_SCHANNEL=ON' packages/curl.cmake
          grep -Fq -- '-DCURL_CA_NATIVE=ON' packages/curl.cmake
          grep -Fq -- '-DUSE_ECH=OFF' packages/curl.cmake
          if grep -Fq -- '-DCURL_USE_OPENSSL=ON' packages/curl.cmake; then
            echo "::error::curl OpenSSL backend is still enabled"
            exit 1
          fi
          if grep -Fq -- '-DCURL_USE_SCHANNEL=OFF' packages/curl.cmake; then
            echo "::error::curl Schannel backend is disabled"
            exit 1
          fi
          if grep -Fq -- '-DUSE_ECH=ON' packages/curl.cmake; then
            echo "::error::curl ECH is enabled in the Schannel release build"
            exit 1
          fi
          if grep -Eq 'ngtcp2|nghttp3|USE_NGTCP2=ON|USE_NGHTTP3=ON' \
            packages/CMakeLists.txt packages/curl.cmake; then
            echo "::error::optional HTTP/3 dependencies are still enabled"
            exit 1
          fi
          grep -A5 -B2 'GIT_REPOSITORY.*mpv-player' packages/mpv.cmake
          grep -n 'PATCH_COMMAND.*mpv-' packages/mpv.cmake
          grep -n -A8 -B2 'avs3-audiodec' packages/CMakeLists.txt
          grep -n -A10 -B4 'GIT_REPOSITORY.*llawsxx' packages/ffmpeg.cmake
          grep -n -A4 -B4 -- '--enable-libarcdav3a' packages/ffmpeg.cmake
          grep -Fq 'ffmpeg-9001-av3a-multiframe-probe.patch' packages/ffmpeg.cmake
          grep -Fq 'ffmpeg-9002-av3a-frame-parser.patch' packages/ffmpeg.cmake
          grep -Fq 'ffmpeg-9003-nvenc-sdk-13.1.patch' packages/ffmpeg.cmake
          grep -Fq 'ffmpeg-9004-libarcdav3a-spatial.patch' packages/ffmpeg.cmake
          grep -n -A8 -B2 'Sourcecodeforplayer' packages/avs3-audiodec.cmake
          grep -Fq 'av3a_binaural_render/AudioDecoder/av3a_binaural_render' \
            packages/avs3-audiodec.cmake
          grep -Fq 'avs3-renderer-build.patch' packages/avs3-audiodec.cmake
          grep -Fq 'add_library(RendererCore STATIC' \
            packages/avs3-renderer-build.patch
          grep -Fq 'install(TARGETS RendererCore avs3_samplerate' \
            packages/avs3-renderer-build.patch
          grep -Fq 'avs3-renderer-hardening.patch' packages/avs3-audiodec.cmake
          grep -Fq 'avs3-normalize-source-eol.py' packages/avs3-audiodec.cmake
          grep -Fq -- '-DAVS3_BUILD_RENDERER=ON' packages/avs3-audiodec.cmake
          grep -Fq -- \
            '-DRENDERER_ROOT=<SOURCE_DIR>/av3a_binaural_render/AudioDecoder/av3a_binaural_render' \
            packages/avs3-audiodec.cmake
          grep -n -A4 -B2 'llawsxx/davs2-10bit' packages/davs2.cmake
          grep -Fq "GIT_TAG $DAVS2_COMMIT" packages/davs2.cmake
          grep -n 'PATCH_COMMAND.*davs2-9000' packages/davs2.cmake
          grep -n -A4 -B4 -- '-Dlibcurl=enabled' packages/mpv.cmake
          grep -n -A12 -B4 -- '-DCURL_USE_OPENSSL=OFF' packages/curl.cmake
          grep -n 'GIT_REPOSITORY.*nv-codec-headers' packages/nvcodec-headers.cmake
          grep -Fq "GIT_TAG $MPV_COMMIT" packages/mpv.cmake
          grep -Fqx 'audio-device=auto' "$GITHUB_WORKSPACE/portable_config/mpv.conf"

      - name: Restore reusable build cache
        uses: actions/cache@v5
        with:
          path: |
            winbuild/mpv-winbuild-cmake/build64
            winbuild/mpv-winbuild-cmake/src_packages
            winbuild/mpv-winbuild-cmake/install_rustup
            .ccache
          key: mpv-hdr-pgs-av3a-schannel-v1-ubuntu-gcc64-${{ hashFiles('.github/workflows/build-mpv-hdr-pgs.yml', 'build/av3a/**', 'patches/0001-vo_gpu_next-add-image-subtitle-colorspace-control.patch') }}
          restore-keys: |
            mpv-hdr-pgs-av3a-schannel-v1-ubuntu-gcc64-

      - name: Reset cached patched sources before building
        shell: bash
        run: |
          set -euxo pipefail
          cd winbuild/mpv-winbuild-cmake
          rm -rf \
            src_packages/avs3-audiodec \
            src_packages/curl \
            src_packages/davs2 \
            src_packages/ffmpeg \
            src_packages/mpv \
            build64/packages/avs3-audiodec-prefix \
            build64/packages/curl-prefix \
            build64/packages/davs2-prefix \
            build64/packages/ffmpeg-prefix \
            build64/packages/mpv-prefix \
            build64/packages/mpv-release-prefix \
            build64/packages/mpv-packaging-prefix

      - name: Preflight and build libcurl dependency chain
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euxo pipefail
          cd winbuild/mpv-winbuild-cmake

          cmake -Wno-dev --fresh \
            -DTARGET_ARCH=x86_64-w64-mingw32 \
            -DCOMPILER_TOOLCHAIN=gcc \
            -DENABLE_CCACHE=ON \
            -DSINGLE_SOURCE_LOCATION="$PWD/src_packages" \
            -DRUSTUP_LOCATION="$PWD/install_rustup" \
            -G Ninja \
            -S . \
            -B build64

          ninja -C build64 download || true
          if [ ! -f build64/install/bin/cross-gcc ]; then
            ninja -C build64 gcc
            rm -rf build64/toolchain
          fi
          ninja -C build64 update
          ninja -C build64 curl

          curl_config_log=build64/packages/curl-prefix/src/curl-stamp/curl-configure-out.log
          test -f "$curl_config_log"
          grep -Fq -- 'Enabled SSL backends: Schannel' "$curl_config_log"
          if grep -Fq -- 'Enabled SSL backends: OpenSSL' "$curl_config_log"; then
            echo "::error::libcurl unexpectedly configured with OpenSSL"
            exit 1
          fi
          grep -F -- 'Features:' "$curl_config_log"
          grep -F -- 'Enabled SSL backends:' "$curl_config_log"

      - name: Build and verify AV3A decoder dependency
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euxo pipefail
          cd winbuild/mpv-winbuild-cmake

          ninja -C build64 avs3-audiodec

          av3a_lib=build64/install/x86_64-w64-mingw32/lib/libAVS3AudioDec.a
          renderer_lib=build64/install/x86_64-w64-mingw32/lib/libRendererCore.a
          samplerate_lib=build64/install/x86_64-w64-mingw32/lib/libavs3_samplerate.a
          test -f "$av3a_lib"
          test -f "$renderer_lib"
          test -f "$samplerate_lib"
          test -f \
            build64/install/x86_64-w64-mingw32/include/avs3a/avs3_spatial_metadata.h
          test -f \
            build64/install/x86_64-w64-mingw32/include/avs3-renderer/avs3_audio.h
          nm -g --defined-only "$av3a_lib" > avs3-audiodec-symbols.txt
          nm -g --defined-only "$renderer_lib" > avs3-renderer-symbols.txt
          for symbol in \
            avs3_create_decoder \
            avs3_destroy_decoder \
            parse_header \
            avs3_decode \
            avs3_get_spatial_stream_info \
            avs3_get_spatial_frame; do
            grep -Eq "[[:space:]]_?${symbol}$" avs3-audiodec-symbols.txt
          done
          for symbol in \
            audio_create_context \
            audio_destroy \
            audio_submit_ambisonic_channel_buffer \
            audio_submit_interleaved_ambisonic_buffer; do
            grep -Eq "[[:space:]]_?${symbol}$" avs3-renderer-symbols.txt
          done

      - name: Build static x86-64 mpv
        id: build
        continue-on-error: true
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euxo pipefail
          cd winbuild/mpv-winbuild-cmake
          bash ../build.sh -t 64 -c gcc -s false

      - name: Collect failed build logs
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          find winbuild/mpv-winbuild-cmake/build64 -type f \
            \( -iname '*-*.log' -o -path '*/ffbuild/config.log' \) \
            -print > build-log-files.txt
          7za a build-logs.7z @build-log-files.txt

      - name: Upload failed build logs
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: mpv-hdr-pgs-build-logs
          path: |
            build-logs.7z
            build-log-files.txt
          if-no-files-found: error
          retention-days: 7

      - name: Stop after failed build
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Verify package contents
        shell: bash
        run: |
          set -euxo pipefail
          archive="$(find winbuild/mpv-winbuild-cmake/release \
            -maxdepth 1 -type f -name 'mpv-x86_64-*.7z' -print -quit)"
          test -n "$archive"
          7za l "$archive" | grep -E 'mpv\.(exe|com)'
          mkdir artifact-check
          7za e -y -oartifact-check "$archive" mpv.exe mpv.com
          strings -a artifact-check/mpv.exe > artifact-check/mpv.strings
          grep -qi schannel artifact-check/mpv.strings
          grep -qi libarcdav3a artifact-check/mpv.strings
          grep -Fq 'SDL 2.0+ audio output' artifact-check/mpv.strings
          grep -Fq 'Windows WASAPI audio output' artifact-check/mpv.strings

          ffmpeg_exe=winbuild/mpv-winbuild-cmake/build64/install/x86_64-w64-mingw32/bin/ffmpeg.exe
          test -f "$ffmpeg_exe"
          strings -a "$ffmpeg_exe" > artifact-check/ffmpeg.strings
          grep -qi libarcdav3a artifact-check/ffmpeg.strings
          grep -Fq av3a_render artifact-check/ffmpeg.strings
          grep -Fq 'force binaural rendering for spatial AV3A streams' \
            artifact-check/ffmpeg.strings

          mkdir artifact
          cp "$archive" artifact/
          cp "$ffmpeg_exe" artifact/ffmpeg-av3a-validation.exe
          cp \
            winbuild/mpv-winbuild-cmake/avs3-audiodec-symbols.txt \
            artifact/AV3A-SYMBOLS.txt
          cp \
            winbuild/mpv-winbuild-cmake/avs3-renderer-symbols.txt \
            artifact/AV3A-RENDERER-SYMBOLS.txt
          cp \
            build/av3a/tests/hoa-order1-128k.av3a \
            artifact/
          cp \
            build/av3a/tests/verify-stage2.ps1 \
            artifact/
          (
            cd artifact
            sha256sum \
              "$(basename "$archive")" \
              ffmpeg-av3a-validation.exe \
              hoa-order1-128k.av3a \
              verify-stage2.ps1 \
              > SHA256SUMS.txt
          )

      - name: Upload custom mpv
        uses: actions/upload-artifact@v6
        with:
          name: mpv-hdr-pgs-av3a-x86_64
          path: artifact/*
          if-no-files-found: error
          retention-days: 7
